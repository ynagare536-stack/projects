# Animated Weather App — `index.html`

```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Live Weather App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            color: white;

            background: linear-gradient(
                135deg,
                #2193b0,
                #6dd5ed
            );

            transition: background 1.5s ease;

        }


        /* =========================
           WEATHER BACKGROUNDS
           ========================= */

        /* Sunny */

        body.sunny {

            background:
                linear-gradient(
                    135deg,
                    #f7971e,
                    #ffd200
                );

        }


        /* Cloudy */

        body.cloudy {

            background:
                linear-gradient(
                    135deg,
                    #667db6,
                    #0082c8
                );

        }


        /* Rain */

        body.rain {

            background:
                linear-gradient(
                    135deg,
                    #314755,
                    #26a0da
                );

        }


        /* Snow */

        body.snow {

            background:
                linear-gradient(
                    135deg,
                    #83a4d4,
                    #b6fbff
                );

        }


        /* Storm */

        body.storm {

            background:
                linear-gradient(
                    135deg,
                    #232526,
                    #414345
                );

        }


        /* Night */

        body.night {

            background:
                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );

        }


        /* =========================
           ANIMATED BACKGROUND
           ========================= */

        .background-animation {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 0;

        }


        /* SUN */

        .sun {

            position: absolute;

            width: 130px;

            height: 130px;

            border-radius: 50%;

            background: #ffd700;

            box-shadow:
                0 0 40px #ffd700,
                0 0 80px #ffb300;

            top: 8%;

            right: 10%;

            opacity: 0;

            transition: 1s;

            animation: sunPulse 3s infinite alternate;

        }


        body.sunny .sun {

            opacity: 1;

        }


        @keyframes sunPulse {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }

        }


        /* CLOUDS */

        .cloud {

            position: absolute;

            width: 160px;

            height: 55px;

            background: rgba(255,255,255,0.7);

            border-radius: 50px;

            opacity: 0;

        }


        .cloud::before {

            content: "";

            position: absolute;

            width: 70px;

            height: 70px;

            background: inherit;

            border-radius: 50%;

            top: -35px;

            left: 30px;

        }


        .cloud::after {

            content: "";

            position: absolute;

            width: 60px;

            height: 60px;

            background: inherit;

            border-radius: 50%;

            top: -25px;

            right: 25px;

        }


        body.cloudy .cloud,
        body.rain .cloud,
        body.storm .cloud {

            opacity: 0.8;

        }


        .cloud1 {

            top: 15%;

            left: -200px;

            animation: moveCloud 25s linear infinite;

        }


        .cloud2 {

            top: 35%;

            left: -250px;

            transform: scale(0.7);

            animation: moveCloud 35s linear infinite;

        }


        .cloud3 {

            top: 55%;

            left: -300px;

            transform: scale(1.2);

            animation: moveCloud 30s linear infinite;

        }


        @keyframes moveCloud {

            from {
                left: -250px;
            }

            to {
                left: 110%;
            }

        }


        /* =========================
           RAIN
           ========================= */

        .rain-container {

            position: absolute;

            inset: 0;

            opacity: 0;

        }


        body.rain .rain-container,
        body.storm .rain-container {

            opacity: 1;

        }


        .drop {

            position: absolute;

            width: 2px;

            height: 20px;

            background: rgba(255,255,255,0.6);

            animation: rainFall linear infinite;

        }


        @keyframes rainFall {

            from {

                transform:
                    translateY(-100px);

            }

            to {

                transform:
                    translateY(110vh);

            }

        }


        /* =========================
           SNOW
           ========================= */

        .snow-container {

            position: absolute;

            inset: 0;

            opacity: 0;

        }


        body.snow .snow-container {

            opacity: 1;

        }


        .flake {

            position: absolute;

            top: -20px;

            color: white;

            font-size: 20px;

            animation: snowFall linear infinite;

        }


        @keyframes snowFall {

            from {

                transform:
                    translateY(-30px)
                    rotate(0deg);

            }

            to {

                transform:
                    translateY(110vh)
                    rotate(360deg);

            }

        }


        /* =========================
           STARS
           ========================= */

        .stars {

            position: absolute;

            inset: 0;

            opacity: 0;

        }


        body.night .stars {

            opacity: 1;

        }


        .star {

            position: absolute;

            width: 3px;

            height: 3px;

            background: white;

            border-radius: 50%;

            animation: twinkle 2s infinite alternate;

        }


        @keyframes twinkle {

            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================
           WEATHER CARD
           ========================= */

        .weather-app {

            position: relative;

            z-index: 10;

            width: 400px;

            max-width: 90%;

            padding: 30px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.18);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border:
                1px solid
                rgba(255,255,255,0.3);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.3);

            text-align: center;

            animation: cardAppear 1s ease;

        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(40px)
                    scale(0.9);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        h1 {

            font-size: 32px;

            margin-bottom: 25px;

        }


        /* =========================
           SEARCH
           ========================= */

        .search-box {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;

        }


        #cityInput {

            flex: 1;

            padding: 14px;

            border: none;

            outline: none;

            border-radius: 12px;

            font-size: 16px;

        }


        #searchBtn {

            padding: 14px 18px;

            border: none;

            border-radius: 12px;

            background: white;

            color: #333;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        #searchBtn:hover {

            transform:
                scale(1.05);

        }


        /* =========================
           WEATHER INFO
           ========================= */

        .weather-icon img {

            width: 110px;

            animation:
                floatIcon 3s ease-in-out infinite;

        }


        @keyframes floatIcon {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-10px);

            }

        }


        .city {

            font-size: 28px;

            font-weight: bold;

            margin-top: 5px;

        }


        .date {

            margin-top: 5px;

            opacity: 0.85;

        }


        .temperature {

            font-size: 65px;

            font-weight: bold;

            margin-top: 10px;

            text-shadow:
                0 5px 15px
                rgba(0,0,0,0.25);

        }


        .condition {

            font-size: 20px;

            text-transform: capitalize;

            margin: 5px 0 25px;

        }


        /* =========================
           DETAILS
           ========================= */

        .details {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

        }


        .detail-box {

            padding: 15px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.15);

            transition: 0.3s;

        }


        .detail-box:hover {

            transform:
                translateY(-5px);

            background:
                rgba(255,255,255,0.25);

        }


        .detail-box p:first-child {

            font-size: 14px;

            opacity: 0.8;

        }


        .detail-box p:last-child {

            font-size: 18px;

            font-weight: bold;

            margin-top: 5px;

        }


        .error {

            color: #ffe0e0;

            font-weight: bold;

        }


        .loading {

            margin: 20px;

            font-size: 18px;

        }


        /* MOBILE */

        @media(max-width: 500px) {

            .weather-app {

                padding: 22px;

            }

            h1 {

                font-size: 26px;

            }

            .temperature {

                font-size: 55px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LIVE BACKGROUND
         ========================= -->

    <div class="background-animation">

        <div class="sun"></div>

        <div class="cloud cloud1"></div>

        <div class="cloud cloud2"></div>

        <div class="cloud cloud3"></div>

        <div class="rain-container"
             id="rainContainer">
        </div>

        <div class="snow-container"
             id="snowContainer">
        </div>

        <div class="stars"
             id="stars">
        </div>

    </div>



    <!-- =========================
         WEATHER APP
         ========================= -->

    <div class="weather-app">

        <h1>🌤️ Live Weather</h1>


        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <div id="weather">

            <div class="weather-icon">
                🌍
            </div>

            <div class="city">
                Search a location
            </div>

            <div class="date">
                Enter a city to get weather
            </div>

        </div>

    </div>



    <script>

        /* =========================
           API
           ========================= */

        const API_KEY =
        "da6cd4554b65913f39b43f55bb0bed54";


        const cityInput =
            document.getElementById(
                "cityInput"
            );

        const searchBtn =
            document.getElementById(
                "searchBtn"
            );

        const weather =
            document.getElementById(
                "weather"
            );


        /* =========================
           CREATE RAIN
           ========================= */

        function createRain() {

            const container =
                document.getElementById(
                    "rainContainer"
                );

            container.innerHTML = "";


            for (let i = 0; i < 100; i++) {

                const drop =
                    document.createElement(
                        "div"
                    );

                drop.className = "drop";

                drop.style.left =
                    Math.random() * 100 + "%";

                drop.style.animationDuration =
                    (0.5 + Math.random() * 0.8)
                    + "s";

                drop.style.animationDelay =
                    Math.random() * 2 + "s";


                container.appendChild(drop);

            }

        }


        /* =========================
           CREATE SNOW
           ========================= */

        function createSnow() {

            const container =
                document.getElementById(
                    "snowContainer"
                );

            container.innerHTML = "";


            for (let i = 0; i < 60; i++) {

                const flake =
                    document.createElement(
                        "div"
                    );

                flake.className = "flake";

                flake.innerHTML = "❄";

                flake.style.left =
                    Math.random() * 100 + "%";

                flake.style.fontSize =
                    (10 + Math.random() * 20)
                    + "px";

                flake.style.animationDuration =
                    (5 + Math.random() * 8)
                    + "s";

                flake.style.animationDelay =
                    Math.random() * 5 + "s";


                container.appendChild(flake);

            }

        }


        /* =========================
           CREATE STARS
           ========================= */

        function createStars() {

            const container =
                document.getElementById(
                    "stars"
                );

            container.innerHTML = "";


            for (let i = 0; i < 100; i++) {

                const star =
                    document.createElement(
                        "div"
                    );

                star.className = "star";

                star.style.left =
                    Math.random() * 100 + "%";

                star.style.top =
                    Math.random() * 100 + "%";

                star.style.animationDelay =
                    Math.random() * 2 + "s";


                container.appendChild(star);

            }

        }


        createRain();

        createSnow();

        createStars();


        /* =========================
           CHANGE BACKGROUND
           ========================= */

        function changeBackground(
            weatherCondition,
            icon
        ) {

            document.body.className = "";


            const condition =
                weatherCondition.toLowerCase();


            /* Night */

            if (icon.endsWith("n")) {

                document.body.classList.add(
                    "night"
                );

                return;

            }


            /* Thunderstorm */

            if (
                condition.includes(
                    "thunder"
                )
            ) {

                document.body.classList.add(
                    "storm"
                );

                return;

            }


            /* Rain */

            if (
                condition.includes("rain") ||
                condition.includes("drizzle")
            ) {

                document.body.classList.add(
                    "rain"
                );

                return;

            }


            /* Snow */

            if (
                condition.includes("snow")
            ) {

                document.body.classList.add(
                    "snow"
                );

                return;

            }


            /* Clouds */

            if (
                condition.includes("cloud") ||
                condition.includes("mist") ||
                condition.includes("fog")
            ) {

                document.body.classList.add(
                    "cloudy"
                );

                return;

            }


            /* Clear */

            document.body.classList.add(
                "sunny"
            );

        }


        /* =========================
           GET WEATHER
           ========================= */

        async function getWeather() {

            const city =
                cityInput.value.trim();


            if (!city) {

                weather.innerHTML = `

                    <div class="error">

                        ❌ Please enter a city name.

                    </div>

                `;

                return;

            }


            weather.innerHTML = `

                <div class="loading">

                    ⏳ Loading weather...

                </div>

            `;


            const API_URL =

                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;


            try {

                const response =
                    await fetch(API_URL);


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "City not found"
                    );

                }


                displayWeather(data);

            }


            catch(error) {

                weather.innerHTML = `

                    <div class="error">

                        ❌ ${error.message}

                    </div>

                `;

            }

        }


        /* =========================
           DISPLAY WEATHER
           ========================= */

        function displayWeather(data) {

            const temperature =
                Math.round(
                    data.main.temp
                );


            const feelsLike =
                Math.round(
                    data.main.feels_like
                );


            const humidity =
                data.main.humidity;


            const windSpeed =
                data.wind.speed;


            const condition =
                data.weather[0]
                    .description;


            const icon =
                data.weather[0]
                    .icon;


            const city =
                data.name;


            const country =
                data.sys.country;


            const today =
                new Date();


            const date =
                today.toLocaleDateString(
                    "en-IN",
                    {
                        weekday: "long",
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                );


            /* Change live background */

            changeBackground(
                condition,
                icon
            );


            weather.innerHTML = `

                <div class="weather-icon">

                    <img
                        src="https://openweathermap.org/img/wn/${icon}@2x.png"
                        alt="${condition}"
                    >

                </div>


                <div class="city">

                    ${city}, ${country}

                </div>


                <div class="date">

                    ${date}

                </div>


                <div class="temperature">

                    ${temperature}°C

                </div>


                <div class="condition">

                    ${condition}

                </div>


                <div class="details">


                    <div class="detail-box">

                        <p>🌡️ Feels Like</p>

                        <p>
                            ${feelsLike}°C
                        </p>

                    </div>


                    <div class="detail-box">

                        <p>💧 Humidity</p>

                        <p>
                            ${humidity}%
                        </p>

                    </div>


                    <div class="detail-box">

                        <p>💨 Wind Speed</p>

                        <p>
                            ${windSpeed} m/s
                        </p>

                    </div>


                    <div class="detail-box">

                        <p>☁️ Condition</p>

                        <p>
                            ${condition}
                        </p>

                    </div>


                </div>

            `;

        }


        /* =========================
           BUTTON
           ========================= */

        searchBtn.addEventListener(
            "click",
            getWeather
        );


        /* ENTER KEY */

        cityInput.addEventListener(
            "keypress",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    getWeather();

                }

            }
        );

    </script>


</body>

</html>
